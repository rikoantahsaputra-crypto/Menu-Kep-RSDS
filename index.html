<style>
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(180deg,#f1f5f9,#ffffff);
color:#0f172a;
}

/* ===== HEADER ===== */
.header{
position:relative;
background:linear-gradient(135deg,#1e3a8a,#2563eb);
padding:60px 20px 90px;
color:white;
text-align:center;
overflow:hidden;
}

.header::after{
content:"";
position:absolute;
bottom:-50px;
left:0;
right:0;
height:100px;
background:#f1f5f9;
border-radius:50% 50% 0 0;
}

.back-btn{
position:absolute;
top:20px;
left:20px;
background:white;
color:#1e3a8a;
padding:8px 14px;
border-radius:10px;
font-size:13px;
font-weight:600;
text-decoration:none;
box-shadow:0 4px 12px rgba(0,0,0,.2);
transition:0.2s;
}

.back-btn:hover{
transform:scale(1.05);
}

.logo{
font-size:42px;
margin-bottom:10px;
}

.title{
font-size:26px;
font-weight:700;
letter-spacing:1px;
}

/* ===== CONTENT ===== */
.container{
max-width:1100px;
margin:auto;
padding:30px 20px;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
}

.card{
background:rgba(255,255,255,0.8);
backdrop-filter:blur(10px);
border-radius:16px;
padding:25px 15px;
text-align:center;
text-decoration:none;
color:#0f172a;
border:1px solid rgba(255,255,255,0.3);
transition:all .25s ease;
box-shadow:0 6px 14px rgba(0,0,0,.08);
}

.card:hover{
transform:translateY(-6px) scale(1.02);
box-shadow:0 14px 25px rgba(0,0,0,.15);
border-color:#2563eb;
}

.icon{
font-size:32px;
margin-bottom:10px;
color:#2563eb;
}

.card-title{
font-size:14px;
font-weight:600;
}

/* ===== RESPONSIVE ===== */
@media(max-width:900px){
.grid{grid-template-columns:repeat(2,1fr);}
}

@media(max-width:600px){
.grid{grid-template-columns:1fr;}
.header{padding:50px 15px 80px;}
.title{font-size:22px;}
}
</style>
